[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghstats-py"
version = "0.2.0"
description = "GitHub Stats Dashboard — visualize your contributions, PRs, and activity"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunaremaia", email = "yunare@gmail.com"}]
keywords = ["github", "stats", "dashboard", "contributions", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
ghstats = "ghstats.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Error-chaining and zip-length bugs. Both are invisible to `ruff check .`
# defaults and silent in production: a `raise` inside `except` without `from`
# flattens the diagnostic to "During handling of the above exception...", and a
# bare `zip()` truncates to the shortest sequence, so a length mismatch drops
# data with no error.
extend-select = ["B904", "B905"]
